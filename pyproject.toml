[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-council-arena"
version = "0.1.0"
description = "A Gradio app for anonymous side-by-side LLM comparison and voting."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gradio>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
llm-council-arena = "arena.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.5",
    "pre-commit==3.7.1",
]

[tool.setuptools.packages.find]
include = ["arena", "arena.*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # allow long lines

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
